name = "rtv-edge-gateway"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"

# Secrets (set via: npx wrangler secret put <KEY>)
# Required:
#   SUPABASE_URL
#   SUPABASE_ANON_KEY
#   SUPABASE_SERVICE_KEY
# Optional:
#   CF_STREAM_API_TOKEN
#   CF_ACCOUNT_ID
#   CF_STREAM_SIGNING_KEY
#   WEBHOOK_SECRET

# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "REPLACE_WITH_REAL_KV_ID"

[observability]
enabled = true
head_sampling_rate = 1

# Optional custom domains (uncomment after DNS):
# routes = [
#   { pattern = "api.rotationtv.network/*", zone_name = "rotationtv.network" }
# ]
